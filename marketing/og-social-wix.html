<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;1,300&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px;
  height: 630px;
  background: #F5F2EC;
  font-family: 'Outfit', sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
/* Subtle radial glow */
body::before {
  content: '';
  position: absolute;
  top: -50px;
  left: 50%;
  transform: translateX(-50%);
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(176,125,46,0.08) 0%, transparent 70%);
  pointer-events: none;
}
.logo-row {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
}
.seedling {
  width: 52px;
  height: 52px;
  background: rgba(176,125,46,0.08);
  border: 1px solid rgba(176,125,46,0.15);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.wordmark {
  font-family: 'Fraunces', serif;
  font-size: 64px;
  font-weight: 300;
  color: #1A2E1A;
  letter-spacing: -0.5px;
}
.wordmark .e { color: #B07D2E; }
.tagline {
  font-size: 13px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: rgba(26,46,26,0.35);
  margin-bottom: 28px;
}
.subtitle {
  font-size: 22px;
  font-weight: 300;
  color: rgba(26,46,26,0.55);
  margin-bottom: 40px;
}
.stats {
  display: flex;
  gap: 48px;
  margin-bottom: 32px;
}
.stat-num {
  font-family: 'Fraunces', serif;
  font-size: 32px;
  color: #B07D2E;
  text-align: center;
}
.stat-label {
  font-size: 12px;
  color: rgba(26,46,26,0.3);
  text-align: center;
  margin-top: 2px;
}
.bottom-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 50px;
  background: rgba(176,125,46,0.05);
  display: flex;
  align-items: center;
  justify-content: center;
}
.bottom-bar span {
  font-size: 15px;
  font-weight: 500;
  color: rgba(26,46,26,0.25);
  letter-spacing: 0.5px;
}
</style>
</head>
<body>
  <div class="logo-row">
    <svg class="seedling" width="52" height="52" viewBox="0 0 36 36" fill="none">
      <circle cx="18" cy="22" r="10" fill="rgba(176,125,46,0.1)" stroke="rgba(176,125,46,0.2)" stroke-width="0.8"/>
      <path d="M18 22 Q14 16 13 10 Q16 14 18 12 Q20 14 23 10 Q22 16 18 22Z" fill="#B07D2E" opacity="0.9"/>
      <path d="M18 22 L18 30" stroke="rgba(176,125,46,0.4)" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="18" cy="22" r="2" fill="#B07D2E"/>
    </svg>
    <span class="wordmark">em<span class="e">e</span>rge</span>
  </div>
  <p class="tagline">Real quests &middot; Real community &middot; Real change</p>
  <p class="subtitle">Find regenerative community events near you</p>
  <div class="stats">
    <div><div class="stat-num">4,300+</div><div class="stat-label">quests</div></div>
    <div><div class="stat-num">23</div><div class="stat-label">countries</div></div>
    <div><div class="stat-num">220+</div><div class="stat-label">cities</div></div>
    <div><div class="stat-num">Free</div><div class="stat-label">always</div></div>
  </div>
  <div class="bottom-bar"><span>emerge.terralta.org</span></div>
</body>
</html>
