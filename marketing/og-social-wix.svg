<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#F5F2EC"/>
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="35%">
      <stop offset="0%" stop-color="rgba(176,125,46,0.12)"/>
      <stop offset="100%" stop-color="rgba(176,125,46,0)"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>
  
  <!-- Seedling icon -->
  <g transform="translate(520, 200)">
    <circle cx="0" cy="0" r="52" fill="rgba(176,125,46,0.08)" stroke="rgba(176,125,46,0.15)" stroke-width="1.5"/>
    <path d="M0 0 Q-18 -28 -22 -56 Q-9 -38 0 -46 Q9 -38 22 -56 Q18 -28 0 0Z" fill="#B07D2E" opacity="0.9"/>
    <line x1="0" y1="0" x2="0" y2="38" stroke="rgba(176,125,46,0.35)" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="9" fill="#B07D2E"/>
  </g>
  
  <!-- "emerge" wordmark -->
  <text x="618" y="218" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="300" letter-spacing="2" fill="#1A2E1A">em<tspan fill="#B07D2E">e</tspan>rge</text>
  
  <!-- Tagline -->
  <text x="600" y="310" text-anchor="middle" font-family="system-ui, -apple-system, Helvetica, sans-serif" font-size="20" font-weight="400" letter-spacing="4" fill="rgba(26,46,26,0.4)" text-transform="uppercase">REAL QUESTS &#183; REAL COMMUNITY &#183; REAL CHANGE</text>
  
  <!-- Subtitle -->
  <text x="600" y="380" text-anchor="middle" font-family="system-ui, -apple-system, Helvetica, sans-serif" font-size="24" font-weight="300" fill="rgba(26,46,26,0.55)">Find regenerative community events near you</text>
  
  <!-- Stats -->
  <text x="340" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="36" fill="#B07D2E">4,300+</text>
  <text x="340" y="498" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="rgba(26,46,26,0.35)">quests</text>
  
  <text x="520" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="36" fill="#B07D2E">23</text>
  <text x="520" y="498" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="rgba(26,46,26,0.35)">countries</text>
  
  <text x="700" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="36" fill="#B07D2E">220+</text>
  <text x="700" y="498" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="rgba(26,46,26,0.35)">cities</text>
  
  <text x="860" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="36" fill="#B07D2E">Free</text>
  <text x="860" y="498" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="rgba(26,46,26,0.35)">always</text>
  
  <!-- Bottom bar -->
  <rect x="0" y="560" width="1200" height="70" fill="rgba(176,125,46,0.06)"/>
  <text x="600" y="602" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="500" fill="rgba(26,46,26,0.3)">emerge.terralta.org</text>
</svg>
