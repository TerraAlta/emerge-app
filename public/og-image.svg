<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0D1A0B"/>
  <!-- Subtle radial glow behind wordmark -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#1E3A1A" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0D1A0B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Wordmark -->
  <text x="600" y="290" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="400" letter-spacing="6" fill="#C8913A">emerge</text>
  <!-- Tagline -->
  <text x="600" y="350" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="300" letter-spacing="2" fill="rgba(232,242,224,0.5)">Regenerative Community Quests</text>
  <!-- Decorative leaf accent -->
  <text x="600" y="410" text-anchor="middle" font-size="28" fill="rgba(200,145,58,0.3)">&#x2022;</text>
</svg>
